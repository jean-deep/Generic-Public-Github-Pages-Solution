<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vitrina — repos privados en GitHub Pages</title>
  <meta name="description" content="Webapp estática para mostrar el contenido de tus repos privados de GitHub usando un PAT, publicable en GitHub Pages." />
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo"></span>
        <span>Vitrina <small>· repos privados en Pages</small></span>
      </div>
      <div class="spacer"></div>
      <div class="session" id="session"></div>
    </header>
    <main id="main" class="content"></main>
  </div>

  <div id="viewer-root" class="hidden" style="position:fixed;inset:0;z-index:40;background:var(--bg)"></div>
  <div id="modal-root"></div>

  <script type="module" src="./assets/app.js"></script>
</body>
</html>
